<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useCallback, useEffect } = React;
const {
  LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer,
  ReferenceLine, ReferenceArea, ReferenceDot, ScatterChart, Scatter, ZAxis, Cell,
} = Recharts;


/* ============================================================
   PALETA (instrumento de telemetria)
   ============================================================ */
const C = {
  bg: "#0B0E14", panel: "#141922", line: "#232B38", text: "#E4E8F0",
  dim: "#7C8798", A: "#22D3EE", B: "#F5A524",
  gain: "#2DD4A7", loss: "#FB6E6E", best: "#A78BFA", grid: "#1C2430",
};

/* ============================================================
   UTILIDADES
   ============================================================ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function haversine(la1, lo1, la2, lo2) {
  const R = 6371000, r = Math.PI / 180;
  const dLa = (la2 - la1) * r, dLo = (lo2 - lo1) * r;
  const a = Math.sin(dLa / 2) ** 2 +
    Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin(dLo / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// interpola y en x dentro de arrays ordenados por xs
function interp(xs, ys, x) {
  if (x <= xs[0]) return ys[0];
  if (x >= xs[xs.length - 1]) return ys[ys.length - 1];
  let lo = 0, hi = xs.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (xs[m] < x) lo = m; else hi = m; }
  const t = (x - xs[lo]) / (xs[hi] - xs[lo] || 1);
  return ys[lo] + t * (ys[hi] - ys[lo]);
}

function fmtLap(s) {
  if (!s || s <= 0) return "--:--.---";
  const m = Math.floor(s / 60), sec = Math.floor(s % 60), ms = Math.round((s - Math.floor(s)) * 1000);
  return `${m}:${String(sec).padStart(2, "0")}.${String(ms).padStart(3, "0")}`;
}
function fmtDelta(d) {
  if (d == null || isNaN(d)) return "";
  return (d >= 0 ? "+" : "") + d.toFixed(3);
}

/* ============================================================
   PARSEO + DETECCION DE VUELTAS
   ============================================================ */
function buildDataset(rows) {
  const num = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
  const data = rows.map((r) => ({
    t: num(r.Time), lat: num(r.Lat), lon: num(r.Lon), speed: num(r.Speed), fix: num(r.Fix),
    ax: num(r.Ax), ay: num(r.Ay), az: num(r.Az), gx: num(r.Gx), gy: num(r.Gy), gz: num(r.Gz),
    // canales ADC: solo existen en el formato nuevo (22 col). Si faltan -> 0.
    gas: num(r.Gas), brake: num(r.Brake), steer: num(r.Steer), temp: num(r.TempC),
    lap: num(r.Lap), ev: num(r.Ev), lapTime: num(r.LapTime),
    hasADC: r.Gas !== undefined && r.Steer !== undefined,
  })).filter((d) => Number.isFinite(d.t) && (d.t !== 0 || rows.length < 3));

  const hasADC = data.length ? data[0].hasADC : false;

  const closes = [];
  data.forEach((d, i) => { if (d.ev === 2 && d.lapTime > 0) closes.push({ idx: i, lap: d.lap, time: d.lapTime }); });

  const laps = [];
  closes.forEach((c) => {
    const endT = data[c.idx].t;
    const targetT = endT - c.time * 1000;      // inicio real = cierre - tiempo de vuelta
    let s = 0;
    for (let i = c.idx; i >= 0; i--) { if (data[i].t <= targetT) { s = i; break; } }
    laps.push({ num: c.lap, time: c.time, start: s, end: c.idx });
  });

  // sin vueltas marcadas -> tratar todo el log como una "sesion" para poder analizarlo igual
  let session = false;
  if (laps.length === 0 && data.length > 1) {
    const withFix = data.filter((d) => d.fix === 1 && d.lat !== 0);
    if (withFix.length > 1) {
      laps.push({ num: 0, time: (data[data.length - 1].t - data[0].t) / 1000, start: 0, end: data.length - 1, session: true });
      session = true;
    }
  }
  return { data, laps, hasADC, session };
}

/* ============================================================
   CALIBRACION
   ============================================================ */
const defaultCal = () => ({
  gas: { min: 0, max: 4095 },
  brake: { min: 0, max: 4095 },
  steer: { left: 0, center: 2048, right: 4095, maxAngle: 90 },
  imu: { long: "ax", lat: "ay", rot: 0, invLong: false, invLat: false },
});

function autoCal(data) {
  const col = (k) => data.map((d) => d[k]).filter(Number.isFinite).sort((a, b) => a - b);
  const pct = (arr, p) => arr[clamp(Math.floor(arr.length * p), 0, arr.length - 1)] || 0;
  const g = col("gas"), b = col("brake"), s = col("steer");
  return {
    gas: { min: pct(g, 0.01), max: pct(g, 0.99) },
    brake: { min: pct(b, 0.01), max: pct(b, 0.99) },
    steer: { left: pct(s, 0.01), center: pct(s, 0.5), right: pct(s, 0.99), maxAngle: 90 },
    imu: defaultCal().imu,
  };
}

const toGas = (raw, c) => clamp(((raw - c.gas.min) / (c.gas.max - c.gas.min || 1)) * 100, 0, 100);
const toBrake = (raw, c) => clamp(((raw - c.brake.min) / (c.brake.max - c.brake.min || 1)) * 100, 0, 100);
function toSteer(raw, c) {
  const s = c.steer;
  if (raw <= s.center) return -clamp((s.center - raw) / (s.center - s.left || 1), 0, 1) * s.maxAngle;
  return clamp((raw - s.center) / (s.right - s.center || 1), 0, 1) * s.maxAngle;
}
// aceleraciones long/lat corregidas por montaje (rotacion en el plano)
function accelLL(d, c) {
  const map = { ax: d.ax, ay: d.ay, az: d.az };
  let lo = map[c.imu.long] * (c.imu.invLong ? -1 : 1);
  let la = map[c.imu.lat] * (c.imu.invLat ? -1 : 1);
  const r = (c.imu.rot * Math.PI) / 180;
  return { lon: lo * Math.cos(r) - la * Math.sin(r), lat: lo * Math.sin(r) + la * Math.cos(r) };
}

/* ============================================================
   GEOMETRIA DE VUELTA (distancia, tiempo, proyeccion)
   ============================================================ */
function lapGeom(data, lap) {
  const seg = data.slice(lap.start, lap.end + 1).filter((d) => d.fix === 1 && d.lat !== 0);
  if (seg.length < 2) return null;
  const dist = [0]; let acc = 0;
  for (let i = 1; i < seg.length; i++) { acc += haversine(seg[i - 1].lat, seg[i - 1].lon, seg[i].lat, seg[i].lon); dist.push(acc); }
  const total = acc || 1;
  const distN = dist.map((x) => x / total);
  const t0 = seg[0].t;
  const trel = seg.map((d) => (d.t - t0) / 1000);
  return { seg, dist, distN, total, trel };
}

/* delta-t: tiempo A - tiempo B remuestreado a la distancia de A */
function computeDelta(gA, gB) {
  if (!gA || !gB) return null;
  return gA.distN.map((dn, i) => gA.trel[i] - interp(gB.distN, gB.trel, dn));
}

/* estadisticas clave de una vuelta */
function lapStats(g, cal, hasADC) {
  const spd = g.seg.map((d) => d.speed);
  const vmin = Math.min(...spd), vmax = Math.max(...spd);
  const vavg = spd.reduce((a, b) => a + b, 0) / spd.length;
  let fullGas = null, braking = null, coasting = null;
  if (hasADC) {
    let fg = 0, br = 0, co = 0;
    g.seg.forEach((d) => {
      const ga = toGas(d.gas, cal), bk = toBrake(d.brake, cal);
      if (ga > 90) fg++;
      if (bk > 8) br++;
      if (ga < 8 && bk < 8) co++;   // ni gas ni freno = coasting (tiempo "muerto")
    });
    const n = g.seg.length;
    fullGas = fg / n * 100; braking = br / n * 100; coasting = co / n * 100;
  }
  const gmax = Math.max(...g.seg.map((d) => Math.abs(accelLL(d, cal).lat)));
  return { vmin, vmax, vavg, fullGas, braking, coasting, gmax };
}

/* convierte cortes {lat,lon} a distancias normalizadas en una vuelta, ordenadas */
function splitDistances(g, splits) {
  return splits.map((sp) => {
    let best = 0, bd = Infinity;
    g.seg.forEach((d, i) => { const dd = (d.lat - sp.lat) ** 2 + (d.lon - sp.lon) ** 2; if (dd < bd) { bd = dd; best = i; } });
    return g.distN[best];
  }).sort((a, b) => a - b);
}
/* limites de sector [0, ...cortes, 1]. Si no hay cortes -> 3 tramos iguales */
function sectorBounds(g, splits) {
  if (splits && splits.length) return [0, ...splitDistances(g, splits), 1];
  return [0, 1 / 3, 2 / 3, 1];
}
/* tiempos por sector segun limites de distancia normalizada */
function sectorTimes(g, bounds) {
  const out = [];
  for (let i = 0; i < bounds.length - 1; i++) {
    const t0 = interp(g.distN, g.trel, bounds[i]), t1 = interp(g.distN, g.trel, bounds[i + 1]);
    out.push(t1 - t0);
  }
  return out;
}
/* vuelta ideal: mejor tiempo de cada sector entre todas las vueltas.
   Nunca puede ser peor que la mejor vuelta real -> se limita a ese valor. */
function theoreticalBest(data, laps, splits) {
  const geoms = laps.map((l) => lapGeom(data, l)).filter(Boolean);
  if (!geoms.length) return null;
  const bounds = sectorBounds(geoms[0], splits);
  const mat = geoms.map((g) => sectorTimes(g, bounds));
  const best = [];
  for (let s = 0; s < bounds.length - 1; s++) {
    let bv = Infinity;
    mat.forEach((row) => { if (row[s] < bv) bv = row[s]; });
    best.push(bv);
  }
  let total = best.reduce((a, b) => a + b, 0);
  const bestReal = Math.min(...laps.map((l) => l.time));   // mejor vuelta cronometrada
  if (!(total < bestReal)) total = bestReal;               // red de seguridad
  return { total, sectors: best, capped: total === bestReal };
}

/* escalas de color */
const speedColor = (t) => `hsl(${(1 - clamp(t, 0, 1)) * 240}, 85%, 55%)`;  // azul lento -> rojo rapido
const gColor = (t) => `hsl(${(1 - clamp(t, 0, 1)) * 120}, 85%, 52%)`;      // verde poco G -> rojo mucho G
// delta divergente: verde (ganas) - gris (igual) - rojo (pierdes), intensidad segun magnitud
function deltaColor(slope, scale) {
  const t = clamp(slope / (scale || 1e-6), -1, 1);
  const a = Math.abs(t);
  const hue = t <= 0 ? 150 : 2;
  return `hsl(${hue}, ${Math.round(a * 80)}%, ${Math.round(62 - a * 14)}%)`;
}
const pctl = (arr, p) => { const s = [...arr].sort((a, b) => a - b); return s.length ? s[clamp(Math.floor(s.length * p), 0, s.length - 1)] : 0; };
const gradientCss = (fn, n = 12) => `linear-gradient(to right, ${Array.from({ length: n }, (_, i) => fn(i / (n - 1))).join(", ")})`;

/* proyeccion equirectangular a viewbox [W,H] con padding */
function projector(pts, W, H, pad = 16) {
  const lats = pts.map((p) => p.lat), lons = pts.map((p) => p.lon);
  const laMin = Math.min(...lats), laMax = Math.max(...lats);
  const loMin = Math.min(...lons), loMax = Math.max(...lons);
  const la0 = (laMin + laMax) / 2;
  const kx = Math.cos((la0 * Math.PI) / 180);
  const w = (loMax - loMin) * kx || 1e-6, h = (laMax - laMin) || 1e-6;
  const sc = Math.min((W - 2 * pad) / w, (H - 2 * pad) / h);
  const ox = (W - w * sc) / 2, oy = (H - h * sc) / 2;
  return (p) => ({
    x: ox + ((p.lon - loMin) * kx) * sc,
    y: H - (oy + ((p.lat - laMin)) * sc), // norte arriba
  });
}

/* ============================================================
   MAPA GPS (traza; interactivo opcional; color por delta)
   ============================================================ */
function GPSMap({ gA, gB, colors, cursor, onPick, W = 560, H = 380, interactive = true, heightCss = null, splits = null }) {
  const svgRef = useRef(null);
  if (!gA) return <Empty msg="Sin datos GPS con fix en esta vuelta." />;

  const proj = useMemo(() => projector(gA.seg, W, H), [gA, W, H]);

  // submuestreo del DIBUJO (no del calculo) para no petar el SVG con vueltas largas
  const MAXDRAW = 900;
  const draw = useMemo(() => {
    const step = Math.max(1, Math.ceil(gA.seg.length / MAXDRAW));
    const idx = []; for (let i = 0; i < gA.seg.length; i += step) idx.push(i);
    if (idx[idx.length - 1] !== gA.seg.length - 1) idx.push(gA.seg.length - 1);
    return {
      pts: idx.map((i) => proj(gA.seg[i])),
      cols: colors ? idx.map((i) => colors[i]) : null,
      idx,
    };
  }, [gA, proj, colors]);
  const ptsA = draw.pts;

  const ptsB = useMemo(() => {
    if (!gB) return null;
    const projB = projector(gB.seg, W, H);
    const step = Math.max(1, Math.ceil(gB.seg.length / MAXDRAW));
    const out = []; for (let i = 0; i < gB.seg.length; i += step) out.push(projB(gB.seg[i]));
    return out;
  }, [gB, W, H]);

  // cortes de sector: proyectados directamente (independientes del submuestreo)
  const splitPts = useMemo(() => {
    if (!splits || !splits.length) return [];
    return splits.map((sp) => {
      let best = 0, bd = Infinity;
      gA.seg.forEach((d, i) => { const dd = (d.lat - sp.lat) ** 2 + (d.lon - sp.lon) ** 2; if (dd < bd) { bd = dd; best = i; } });
      return proj(gA.seg[best]);
    });
  }, [splits, gA, proj]);

  const handleClick = useCallback((e) => {
    if (!interactive || !onPick) return;
    const rect = svgRef.current.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * W;
    const y = ((e.clientY - rect.top) / rect.height) * H;
    let best = 0, bd = Infinity;
    ptsA.forEach((p, i) => { const dd = (p.x - x) ** 2 + (p.y - y) ** 2; if (dd < bd) { bd = dd; best = i; } });
    onPick(draw.idx[best] / (gA.seg.length - 1));
  }, [interactive, onPick, ptsA, draw, gA, W, H]);

  const cur = cursor != null ? proj(gA.seg[clamp(Math.round(cursor * (gA.seg.length - 1)), 0, gA.seg.length - 1)]) : null;

  return (
    <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} width="100%" onClick={handleClick}
      style={{ cursor: interactive ? "crosshair" : "default", background: C.bg, borderRadius: 8, touchAction: "manipulation", height: heightCss || "auto", display: "block" }}>
      {ptsB && <polyline fill="none" stroke={C.B} strokeOpacity="0.35" strokeWidth="2"
        points={ptsB.map((p) => `${p.x},${p.y}`).join(" ")} />}
      {draw.cols
        ? ptsA.slice(1).map((p, i) => (
            <line key={i} x1={ptsA[i].x} y1={ptsA[i].y} x2={p.x} y2={p.y}
              stroke={draw.cols[i + 1] || C.dim} strokeWidth="3.5" strokeLinecap="round" />))
        : <polyline fill="none" stroke={C.A} strokeWidth="3" points={ptsA.map((p) => `${p.x},${p.y}`).join(" ")} />}
      {splitPts.map((p, i) => p && (
        <g key={i}>
          <circle cx={p.x} cy={p.y} r="7" fill="none" stroke={C.best} strokeWidth="2.5" />
          <text x={p.x} y={p.y - 11} fill={C.best} fontSize="12" fontFamily="monospace" textAnchor="middle">S{i + 2}</text>
        </g>
      ))}
      {cur && <circle cx={cur.x} cy={cur.y} r="6" fill={C.text} stroke={C.bg} strokeWidth="2" />}
      {ptsA[0] && <circle cx={ptsA[0].x} cy={ptsA[0].y} r="4" fill={C.best} />}
    </svg>
  );
}

/* ============================================================
   GRAFICA DE CANAL (recharts, cursor sincronizado)
   ============================================================ */
function Channel({ title, unit, series, color, colorB, cursor, onCursor, domain, height = 120, showX = false, xUnit = "", xDomain, onZoom }) {
  const curIdx = cursor != null ? Math.round(cursor * (series.length - 1)) : null;
  const [refL, setRefL] = React.useState(null);
  const [refR, setRefR] = React.useState(null);
  const dragging = refL != null;
  const down = (e) => {
    if (e && e.activeLabel != null) {
      setRefL(e.activeLabel); setRefR(null);
      if (e.activeTooltipIndex != null && onCursor) onCursor(e.activeTooltipIndex / (series.length - 1)); // mueve cursor al tocar
    }
  };
  const move = (e) => {
    if (!e) return;
    if (refL != null) setRefR(e.activeLabel);                 // arrastrando: marca zona de posible zoom
    if (e.activeTooltipIndex != null && onCursor) onCursor(e.activeTooltipIndex / (series.length - 1)); // cursor sigue el dedo
  };
  const up = () => {
    if (refL != null && refR != null && onZoom && series.length > 1) {
      const range = Math.abs(series[series.length - 1].d - series[0].d) || 1;
      if (Math.abs(refR - refL) > range * 0.03)              // solo zoom si el arrastre cubre > 3% del eje
        onZoom([Math.min(refL, refR), Math.max(refL, refR)]);
    }
    setRefL(null); setRefR(null);
  };
  return (
    <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 8, padding: "8px 10px 4px", touchAction: "pan-y" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 2 }}>
        <span style={{ fontSize: 11, color: C.dim, fontFamily: "monospace", letterSpacing: 1, textTransform: "uppercase" }}>{title}</span>
        <span style={{ fontFamily: "monospace", fontSize: 18, fontWeight: 700 }}>
          {curIdx != null && series[curIdx] ? <>
            <span style={{ color }}>{series[curIdx].a?.toFixed(unit === "°" ? 0 : 1)}</span>
            {colorB && series[curIdx].b != null && <span style={{ color: colorB, fontSize: 13, marginLeft: 8 }}>{series[curIdx].b?.toFixed(unit === "°" ? 0 : 1)}</span>}
            <span style={{ color: C.dim, fontSize: 12, marginLeft: 4 }}>{unit}</span>
          </> : <span style={{ color: C.dim, fontSize: 12 }}>{unit}</span>}
        </span>
      </div>
      <ResponsiveContainer width="100%" height={height}>
        <LineChart data={series} margin={{ top: 4, right: 6, left: -18, bottom: showX ? 2 : 0 }}
          onMouseDown={down} onMouseMove={move} onMouseUp={up} onMouseLeave={up}>
          <CartesianGrid stroke={C.grid} vertical={false} />
          <XAxis dataKey="d" type="number" domain={xDomain || ["dataMin", "dataMax"]} allowDataOverflow hide={!showX}
            tick={{ fill: C.dim, fontSize: 10, fontFamily: "monospace" }}
            tickFormatter={(v) => (xUnit === "s" ? v.toFixed(0) : Math.round(v))} height={showX ? 18 : 0} />
          <YAxis domain={domain} tick={{ fill: C.dim, fontSize: 10, fontFamily: "monospace" }} width={34} />
          <Tooltip contentStyle={{ display: "none" }} />
          {colorB && <Line dataKey="b" stroke={colorB} dot={false} strokeWidth={1.4} strokeOpacity={0.7} isAnimationActive={false} />}
          <Line dataKey="a" stroke={color} dot={false} strokeWidth={1.8} isAnimationActive={false} />
          {curIdx != null && <ReferenceLine x={series[curIdx]?.d} stroke={C.text} strokeWidth={1} />}
          {curIdx != null && series[curIdx] && <ReferenceDot x={series[curIdx].d} y={series[curIdx].a} r={4} fill={color} stroke={C.bg} strokeWidth={1.5} isFront />}
          {refL != null && refR != null && refL !== refR && <ReferenceArea x1={refL} x2={refR} fill={C.A} fillOpacity={0.15} />}
        </LineChart>
      </ResponsiveContainer>
    </div>
  );
}

/* ============================================================
   DIAGRAMA G-G
   ============================================================ */
function GGDiagram({ gA, cal, cursor, smooth }) {
  const { pts, vlo, vhi } = useMemo(() => {
    if (!gA) return { pts: [], vlo: 0, vhi: 0 };
    const spd = gA.seg.map((d) => d.speed);
    const vlo = Math.min(...spd), vhi = Math.max(...spd);
    // suavizado (media movil) para quitar la vibracion del quad
    const win = Math.max(1, smooth | 0);
    const lat = gA.seg.map((d) => accelLL(d, cal).lat);
    const lon = gA.seg.map((d) => accelLL(d, cal).lon);
    const smoo = (arr, i) => { let s = 0, n = 0; for (let k = -win; k <= win; k++) { const j = i + k; if (j >= 0 && j < arr.length) { s += arr[j]; n++; } } return s / n; };
    // submuestreo del dibujo
    const MAX = 1500, step = Math.max(1, Math.ceil(gA.seg.length / MAX));
    const pts = [];
    for (let i = 0; i < gA.seg.length; i += step) {
      const x = smoo(lat, i), y = smoo(lon, i);
      if (Number.isFinite(x) && Number.isFinite(y)) pts.push({ x, y, vn: (gA.seg[i].speed - vlo) / (vhi - vlo || 1), i });
    }
    return { pts, vlo, vhi };
  }, [gA, cal, smooth]);
  const lim = 2.5;
  const curPt = cursor != null && pts.length ? pts[clamp(Math.round(cursor * (pts.length - 1)), 0, pts.length - 1)] : null;
  return (
    <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 8, padding: 10 }}>
      <div style={{ fontSize: 11, color: C.dim, fontFamily: "monospace", letterSpacing: 1, marginBottom: 4 }}>DIAGRAMA G-G · color = velocidad</div>
      <ResponsiveContainer width="100%" height={260}>
        <ScatterChart margin={{ top: 6, right: 6, bottom: 6, left: -6 }}>
          <CartesianGrid stroke={C.grid} />
          <XAxis type="number" dataKey="x" domain={[-lim, lim]} tick={{ fill: C.dim, fontSize: 10 }} name="lateral" />
          <YAxis type="number" dataKey="y" domain={[-lim, lim]} tick={{ fill: C.dim, fontSize: 10 }} name="long" />
          <ReferenceLine x={0} stroke={C.line} /><ReferenceLine y={0} stroke={C.line} />
          <Scatter data={pts} isAnimationActive={false}>
            {pts.map((p, i) => <Cell key={i} fill={speedColor(p.vn)} fillOpacity={0.5} />)}
          </Scatter>
          {curPt && <Scatter data={[curPt]} fill={C.text} isAnimationActive={false} />}
        </ScatterChart>
      </ResponsiveContainer>
      <div style={{ fontSize: 10, color: C.dim, textAlign: "center", marginBottom: 6 }}>← lateral →  ·  ↑ acelera / ↓ frena</div>
      <MapLegend legend={{ grad: gradientCss(speedColor), left: `${vlo.toFixed(0)} km/h`, right: `${vhi.toFixed(0)} km/h` }} />
    </div>
  );
}

/* ---- tabla comparativa A vs B ---- */
function StatsTable({ statsA, statsB, hasADC, gB }) {
  if (!statsA) return null;
  // [label, valA, valB, unidad, decimales, mejorEsMas(true)/menos(false)/neutro(null)]
  const rows = [
    ["V. mín", statsA.vmin, statsB?.vmin, "km/h", 1, true],
    ["V. máx", statsA.vmax, statsB?.vmax, "km/h", 1, true],
    ["V. media", statsA.vavg, statsB?.vavg, "km/h", 1, true],
    ["G lat máx", statsA.gmax, statsB?.gmax, "g", 2, true],
  ];
  if (hasADC) {
    rows.push(["% full gas", statsA.fullGas, statsB?.fullGas, "%", 0, true]);
    rows.push(["% freno", statsA.braking, statsB?.braking, "%", 0, null]);
    rows.push(["% sin gas/freno", statsA.coasting, statsB?.coasting, "%", 0, false]);
  }
  const cell = (v, dec) => (v == null ? "—" : v.toFixed(dec));
  const better = (a, b, more) => (b == null || more == null ? null : more ? (a >= b ? C.A : C.B) : (a <= b ? C.A : C.B));
  return (
    <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 10, padding: 12 }}>
      <div style={{ fontFamily: "monospace", fontSize: 12, color: C.dim, letterSpacing: 1, marginBottom: 8 }}>COMPARATIVA</div>
      <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: "monospace", fontSize: 14 }}>
        <thead><tr style={{ color: C.dim, fontSize: 11 }}>
          <th style={{ textAlign: "left", fontWeight: 400 }}></th>
          <th style={{ textAlign: "right", color: C.A }}>A</th>
          {gB && <th style={{ textAlign: "right", color: C.B }}>B</th>}
        </tr></thead>
        <tbody>
          {rows.map(([lab, a, b, u, dec, more], i) => (
            <tr key={i} style={{ borderTop: `1px solid ${C.line}` }}>
              <td style={{ color: C.dim, padding: "5px 0" }}>{lab}</td>
              <td style={{ textAlign: "right", color: better(a, b, more) || C.text }}>{cell(a, dec)}<span style={{ color: C.dim, fontSize: 11 }}> {u}</span></td>
              {gB && <td style={{ textAlign: "right", color: better(b, a, more) || C.text }}>{cell(b, dec)}<span style={{ color: C.dim, fontSize: 11 }}> {u}</span></td>}

          ))}

}

/* ---- tabla de tiempos y sectores de TODAS las vueltas ---- */
function AllSectorsTable({ data, laps, splits, ideal }) {
  const geoms = laps.map((l) => lapGeom(data, l)).filter(Boolean);
  if (!geoms.length || laps[0]?.session) return <Empty msg="Este log no tiene vueltas cronometradas." />;
  const bounds = sectorBounds(geoms[0], splits);
  const nsec = bounds.length - 1;
  const rows = geoms.map((g, i) => ({ num: laps[i].num, secs: sectorTimes(g, bounds), total: laps[i].time }));
  const bestSec = Array.from({ length: nsec }, (_, s) => Math.min(...rows.map((r) => r.secs[s])));
  const bestTot = Math.min(...rows.map((r) => r.total));
  const th = { padding: "8px 10px", textAlign: "right", color: C.dim, fontWeight: 400, fontSize: 12, borderBottom: `1px solid ${C.line}` };
  const td = { padding: "8px 10px", textAlign: "right", fontSize: 15 };
  const secFmt = (s) => s.toFixed(3);
  return (
    <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 10, padding: 4, overflowX: "auto" }}>
      <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: "monospace" }}>
        <thead><tr>
          <th style={{ ...th, textAlign: "left" }}>Vuelta</th>
          {Array.from({ length: nsec }, (_, s) => <th key={s} style={th}>S{s + 1}</th>)}
          <th style={{ ...th, color: C.text }}>Total</th>
        </tr></thead>
        <tbody>
          {rows.map((r, i) => (
            <tr key={i} style={{ borderBottom: `1px solid ${C.line}` }}>
              <td style={{ ...td, textAlign: "left", color: r.total === bestTot ? C.best : C.text }}>{r.total === bestTot ? "★" : ""}L{r.num}</td>
              {r.secs.map((s, si) => (
                <td key={si} style={{ ...td, color: Math.abs(s - bestSec[si]) < 1e-6 ? C.best : C.text, fontWeight: Math.abs(s - bestSec[si]) < 1e-6 ? 700 : 400 }}>{secFmt(s)}</td>
              ))}
              <td style={{ ...td, fontWeight: 700, color: r.total === bestTot ? C.best : C.text }}>{fmtLap(r.total)}</td>
            </tr>
          ))}
          {/* fila ideal: mejor de cada sector */}
          <tr style={{ background: "#10161F" }}>
            <td style={{ ...td, textAlign: "left", color: C.best }}>◆ IDEAL</td>
            {bestSec.map((s, si) => <td key={si} style={{ ...td, color: C.best }}>{secFmt(s)}</td>)}
            <td style={{ ...td, fontWeight: 700, color: C.best }}>{ideal ? fmtLap(ideal.total) : "—"}</td>
          </tr>
        </tbody>
      </table>
      <div style={{ padding: "6px 10px", fontSize: 11, fontFamily: "monospace", color: C.dim }}>
        <span style={{ color: C.best }}>★ / morado</span> = mejor de cada columna · {nsec} sectores {splits.length ? "(definidos por ti)" : "(3 automáticos)"}
      </div>
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App() {
  const [ds, setDs] = useState(null);          // { data, laps }
  const [cal, setCal] = useState(() => { try { const s = localStorage.getItem('paddock_cal'); return s ? JSON.parse(s) : defaultCal(); } catch(e){ return defaultCal(); } });
  const [page, setPage] = useState("overview");
  const [aIdx, setAIdx] = useState(0);
  const [bIdx, setBIdx] = useState(1);
  const [cursor, setCursor] = useState(null);   // 0..1 sobre vuelta A
  const [xMode, setXMode] = useState("dist");   // eje X: 'dist' (m) | 'time' (s)
  const [xZoom, setXZoom] = useState(null);     // [min,max] del eje X o null
  const [mapMode, setMapMode] = useState("delta"); // color del mapa: delta | speed | glat
  const [splits, setSplits] = useState(() => { try { const s = localStorage.getItem("paddock_splits"); return s ? JSON.parse(s) : []; } catch (e) { return []; } });
  const [sectorEdit, setSectorEdit] = useState(false);
  const [chans, setChans] = useState({ speed: true, gas: true, brake: true, steer: true });
  const [smooth, setSmooth] = useState(3);      // suavizado IMU (media movil ±N muestras)
  const [fileName, setFileName] = useState("");
  useEffect(() => { try { localStorage.setItem("paddock_cal", JSON.stringify(cal)); } catch(e){} }, [cal]);

  const onFile = (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    setFileName(f.name);
    const reader = new FileReader();
    reader.onload = (ev) => {
      // normaliza saltos de linea (Windows \r\n / Mac \r) -> \n, evita que PapaParse los junte
      const text = String(ev.target.result).replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      const res = Papa.parse(text, {
        header: true, dynamicTyping: false, skipEmptyLines: true,
        transformHeader: (h) => h.trim(),
      });
      const built = buildDataset(res.data);
      setDs(built);
      setAIdx(0); setBIdx(built.laps.length > 1 ? 1 : 0); setCursor(null);
    };
    reader.readAsText(f);
  };

  const laps = ds?.laps || [];
  const best = laps.length ? Math.min(...laps.map((l) => l.time)) : 0;
  const gA = useMemo(() => (ds && laps[aIdx] ? lapGeom(ds.data, laps[aIdx]) : null), [ds, aIdx]);
  const gB = useMemo(() => (ds && laps[bIdx] && bIdx !== aIdx ? lapGeom(ds.data, laps[bIdx]) : null), [ds, bIdx, aIdx]);
  const delta = useMemo(() => computeDelta(gA, gB), [gA, gB]);
  const finalDelta = delta ? delta[delta.length - 1] : null;

  // colores del mapa + info de leyenda segun el modo
  const mapData = useMemo(() => {
    if (!gA) return { colors: null, legend: null };
    if (mapMode === "delta") {
      if (!delta) return { colors: null, legend: null };
      const slopes = delta.map((_, i) => (i === 0 ? 0 : delta[i] - delta[i - 1]));
      const scale = pctl(slopes.map(Math.abs).filter((x) => x > 0), 0.9) || 1e-6;
      return {
        colors: slopes.map((s) => deltaColor(s, scale)),
        legend: { grad: gradientCss((u) => deltaColor((u * 2 - 1) * scale, scale)), left: "ganas", right: "pierdes", title: "Delta A vs B" },
      };
    }
    if (mapMode === "speed") {
      const spd = gA.seg.map((d) => d.speed);
      const lo = Math.min(...spd), hi = Math.max(...spd);
      return {
        colors: spd.map((v) => speedColor((v - lo) / (hi - lo || 1))),
        legend: { grad: gradientCss(speedColor), left: `${lo.toFixed(0)} km/h`, right: `${hi.toFixed(0)} km/h`, title: "Velocidad" },
      };
    }
    if (mapMode === "glat") {
      const gl = gA.seg.map((d) => Math.abs(accelLL(d, cal).lat));
      const hi = Math.max(...gl, 0.1);
      return {
        colors: gl.map((v) => gColor(v / hi)),
        legend: { grad: gradientCss(gColor), left: "0 g", right: `${hi.toFixed(1)} g`, title: "G lateral" },
      };
    }
    return { colors: null, legend: null };
  }, [gA, delta, mapMode, cal]);
  const mapColors = mapData.colors;
  const mapLegend = mapData.legend;

  useEffect(() => { try { localStorage.setItem("paddock_splits", JSON.stringify(splits)); } catch (e) {} }, [splits]);

  // stats A/B, sectores y vuelta ideal
  const statsA = useMemo(() => (gA ? lapStats(gA, cal, ds?.hasADC) : null), [gA, cal, ds]);
  const statsB = useMemo(() => (gB ? lapStats(gB, cal, ds?.hasADC) : null), [gB, cal, ds]);
  const secA = useMemo(() => (gA ? sectorTimes(gA, sectorBounds(gA, splits)) : null), [gA, splits]);
  const secB = useMemo(() => (gB ? sectorTimes(gB, sectorBounds(gB, splits)) : null), [gB, splits]);
  const ideal = useMemo(() => (ds && laps.length ? theoreticalBest(ds.data, laps, splits) : null), [ds, laps, splits]);

  // series para graficas. Muestreo por distancia normalizada (alinea A y B espacialmente);
  // el eje X muestra distancia real (m) o tiempo de A (s) segun xMode.
  const series = useMemo(() => {
    if (!gA) return null;
    const N = Math.min(600, gA.seg.length);
    // valor del eje X en cada punto (0..1 -> m o s)
    const xVal = (dn) => xMode === "time" ? interp(gA.distN, gA.trel, dn) : dn * gA.total;
    const pick = (g, conv) => {
      if (!g) return null;
      const xs = g.distN, ys = g.seg.map((d) => conv(d));
      return (dn) => interp(xs, ys, dn);
    };
    const mk = (conv) => {
      const fa = pick(gA, conv), fb = pick(gB, conv);
      return Array.from({ length: N }, (_, i) => {
        const dn = i / (N - 1);
        return { d: xVal(dn), f: dn, a: fa(dn), b: fb ? fb(dn) : null };
      });
    };
    return {
      xMax: xVal(1),
      speed: mk((d) => d.speed),
      gas: mk((d) => toGas(d.gas, cal)),
      brake: mk((d) => toBrake(d.brake, cal)),
      steer: mk((d) => toSteer(d.steer, cal)),
      deltaLine: (() => {
        if (!delta) return null;
        return Array.from({ length: N }, (_, i) => { const dn = i / (N - 1); return { d: xVal(dn), f: dn, a: interp(gA.distN, delta, dn) }; });
      })(),
    };
  }, [gA, gB, cal, delta, xMode]);

  /* ---------- pantalla de carga ---------- */
  if (!ds) {
    return (
      <Shell page={page} setPage={setPage} onFile={onFile} fileName={fileName} hasData={false}>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "70vh", gap: 18 }}>
          <div style={{ fontFamily: "monospace", fontSize: 13, color: C.dim, letterSpacing: 2 }}>PADDOCK · TELEMETRÍA</div>
          <div style={{ fontSize: 30, fontWeight: 800, color: C.text, letterSpacing: -0.5 }}>Sube un log del datalogger</div>
          <div style={{ color: C.dim, fontSize: 14, maxWidth: 460, textAlign: "center", lineHeight: 1.6 }}>
            Un CSV <span style={{ color: C.A, fontFamily: "monospace" }}>GpsImuNex_N.csv</span>. Las vueltas se detectan solas por los eventos de meta.
          </div>
          <label style={{ ...btn(C.A), padding: "12px 26px", fontSize: 15, cursor: "pointer" }}>
            Elegir archivo<input type="file" accept=".csv" onChange={onFile} style={{ display: "none" }} />
          </label>
        </div>
      </Shell>
    );
  }

  /* ---------- OVERVIEW ---------- */
  const overview = (
    <div style={{ display: "grid", gridTemplateColumns: "250px 1fr", gap: 14, alignItems: "start" }}>
      <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden" }}>
        <div style={{ padding: "10px 12px", fontFamily: "monospace", fontSize: 12, color: C.dim, letterSpacing: 1, borderBottom: `1px solid ${C.line}` }}>
          VUELTAS · {laps.length}
        </div>
        {laps.length === 0 && <Empty msg="No hay vueltas cerradas en este log (¿marcaste meta?)." />}
        {laps.map((l, i) => (
          <LapRow key={i} lap={l} best={best} isA={i === aIdx} isB={i === bIdx}
            onA={() => setAIdx(i)} onB={() => setBIdx(i)} />
        ))}
        {ideal && laps.length > 1 && (
          <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 10px", background: "#10161F", fontFamily: "monospace", fontSize: 13 }}>
            <span style={{ color: C.best }}>◆ IDEAL</span>
            <span style={{ color: C.best, fontWeight: 700 }}>{fmtLap(ideal.total)}</span>
          </div>
        )}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 10, padding: 12 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, flexWrap: "wrap", gap: 8 }}>
            <div style={{ fontFamily: "monospace", fontSize: 12, color: C.dim, letterSpacing: 1 }}>
              <span style={{ color: C.A }}>A · L{laps[aIdx]?.num} {fmtLap(laps[aIdx]?.time)}</span>
              {gB && <span style={{ color: C.B, marginLeft: 14 }}>B · L{laps[bIdx]?.num} {fmtLap(laps[bIdx]?.time)}</span>}
            </div>
            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <span style={{ fontSize: 11, fontFamily: "monospace", color: C.dim }}>color:</span>
              <button onClick={() => setMapMode("delta")} style={btn(mapMode === "delta" ? C.A : null)}>Delta</button>
              <button onClick={() => setMapMode("speed")} style={btn(mapMode === "speed" ? C.A : null)}>Velocidad</button>
              <button onClick={() => setMapMode("glat")} style={btn(mapMode === "glat" ? C.A : null)}>G lat</button>
            </div>
            {finalDelta != null && (
              <div style={{ fontFamily: "monospace", fontSize: 20, fontWeight: 800, color: finalDelta <= 0 ? C.gain : C.loss }}>
                {fmtDelta(finalDelta)}s
              </div>
            )}
          </div>
          <GPSMap gA={gA} gB={gB} colors={mapColors} cursor={cursor} splits={splits}
            onPick={(f) => {
              if (sectorEdit && gA) {
                const i = clamp(Math.round(f * (gA.seg.length - 1)), 0, gA.seg.length - 1);
                setSplits((s) => [...s, { lat: gA.seg[i].lat, lon: gA.seg[i].lon }]);
              } else setCursor(f);
            }}
            W={900} H={620} heightCss="min(64vh, 620px)" />
          <div style={{ display: "flex", gap: 12, marginTop: 8, alignItems: "center", flexWrap: "wrap" }}>
            <span style={{ fontSize: 11, fontFamily: "monospace", color: C.dim, letterSpacing: 1, minWidth: 70 }}>{mapLegend?.title?.toUpperCase() || "MAPA"}</span>
            <MapLegend legend={mapLegend} />
            {gB && <span style={{ fontSize: 11, fontFamily: "monospace", color: C.dim }}><span style={{ color: C.B }}>▬</span> vuelta B</span>}
          </div>
          <div style={{ display: "flex", gap: 6, marginTop: 8, alignItems: "center" }}>
            <button onClick={() => setSectorEdit((v) => !v)} style={btn(sectorEdit ? C.best : null)}>
              {sectorEdit ? "✓ tocando = corte de sector" : "＋ Definir sectores"}
            </button>
            {splits.length > 0 && <button onClick={() => setSplits([])} style={btn(C.loss)}>Limpiar ({splits.length})</button>}
            {sectorEdit && <span style={{ fontSize: 11, fontFamily: "monospace", color: C.dim }}>toca el mapa donde quieras un corte</span>}
          </div>
        </div>
        {/* tabla comparativa + sectores */}
        <div style={{ display: "grid", gridTemplateColumns: gB ? "1fr 1fr" : "1fr", gap: 12 }}>
          <StatsTable statsA={statsA} statsB={statsB} hasADC={ds.hasADC} gB={!!gB} />
          {gB && secA && secB && <SectorTable secA={secA} secB={secB} />}
        </div>
      </div>
    </div>
  );

  /* ---------- ANALISIS ---------- */
  const analysis = (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 300px", gap: 14, alignItems: "start" }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, fontFamily: "monospace", color: C.dim, flexWrap: "wrap" }}>
          <span>eje X:</span>
          <button onClick={() => { setXMode("dist"); setXZoom(null); }} style={btn(xMode === "dist" ? C.A : null)}>Distancia (m)</button>
          <button onClick={() => { setXMode("time"); setXZoom(null); }} style={btn(xMode === "time" ? C.A : null)}>Tiempo (s)</button>
          {xZoom && <button onClick={() => setXZoom(null)} style={{ ...btn(C.loss) }}>Reset zoom ✕</button>}
          <span style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center" }}>
            <span>ver:</span>
            <ChanToggle label="Vel" on={chans.speed} onClick={() => setChans((c) => ({ ...c, speed: !c.speed }))} />
            {ds.hasADC && <>
              <ChanToggle label="Gas" on={chans.gas} onClick={() => setChans((c) => ({ ...c, gas: !c.gas }))} />
              <ChanToggle label="Freno" on={chans.brake} onClick={() => setChans((c) => ({ ...c, brake: !c.brake }))} />
              <ChanToggle label="Dir" on={chans.steer} onClick={() => setChans((c) => ({ ...c, steer: !c.steer }))} />
            </>}
          </span>
        </div>
        {series && <>
          {chans.speed && <Channel title="Velocidad" unit="km/h" series={series.speed} color={C.A} colorB={gB ? C.B : null} cursor={cursor} onCursor={setCursor} domain={[0, "auto"]}  xDomain={xZoom || undefined} onZoom={setXZoom} />}
          {ds.hasADC ? <>
            {chans.gas && <Channel title="Acelerador" unit="%" series={series.gas} color={C.gain} colorB={gB ? C.B : null} cursor={cursor} onCursor={setCursor} domain={[0, 100]}  xDomain={xZoom || undefined} onZoom={setXZoom} />}
            {chans.brake && <Channel title="Freno" unit="%" series={series.brake} color={C.loss} colorB={gB ? C.B : null} cursor={cursor} onCursor={setCursor} domain={[0, 100]}  xDomain={xZoom || undefined} onZoom={setXZoom} />}
            {chans.steer && <Channel title="Dirección" unit="°" series={series.steer} color={C.best} colorB={gB ? C.B : null} cursor={cursor} onCursor={setCursor} domain={[-cal.steer.maxAngle, cal.steer.maxAngle]}  xDomain={xZoom || undefined} onZoom={setXZoom} />}
          </> : (
            <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 8, padding: "12px 14px", fontSize: 12, color: C.dim }}>
              Este log solo tiene acelerador (sin freno/dirección). Puedes ocultar canales arriba para dar más espacio.
            </div>
          )}
          {series.deltaLine && <Channel title="Delta A−B (acumulado)" unit="s" series={series.deltaLine} color={C.text} cursor={cursor} onCursor={setCursor} domain={["auto", "auto"]} height={100} showX xUnit={xMode === "time" ? "s" : "m"}  xDomain={xZoom || undefined} onZoom={setXZoom} />}
        </>}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12, position: "sticky", top: 12 }}>
        <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 8, padding: 8 }}>
          <div style={{ fontSize: 11, color: C.dim, fontFamily: "monospace", letterSpacing: 1, marginBottom: 4 }}>MAPA · {mapLegend?.title || ""}</div>
          <GPSMap gA={gA} gB={gB} colors={mapColors} cursor={cursor} interactive={false} W={280} H={200} />
          <div style={{ marginTop: 6 }}><MapLegend legend={mapLegend} /></div>
        </div>
        <GGDiagram gA={gA} cal={cal} cursor={cursor} smooth={smooth} />
        <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 8, padding: 10 }}>
          <div style={{ fontSize: 11, color: C.dim, fontFamily: "monospace", letterSpacing: 1, marginBottom: 4 }}>
            SUAVIZADO IMU: ±{smooth} muestras {smooth === 0 ? "(crudo)" : ""}
          </div>
          <input type="range" min={0} max={15} value={smooth} onChange={(e) => setSmooth(+e.target.value)} style={{ width: "100%" }} />
          <div style={{ fontSize: 10, color: C.dim }}>sube si el G-G está muy disperso por la vibración del quad</div>
        </div>
      </div>
    </div>
  );

  /* ---------- CONFIG ---------- */
  const cfg = (label, obj, path) => (
    <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 10, padding: 14 }}>
      <div style={{ fontFamily: "monospace", fontSize: 13, color: C.text, letterSpacing: 1, marginBottom: 10 }}>{label}</div>
      {obj}
    </div>
  );
  const setCalPath = (grp, key, v) => setCal((c) => ({ ...c, [grp]: { ...c[grp], [key]: v } }));
  const config = (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(240px,1fr))", gap: 14 }}>
      <button onClick={() => setCal(autoCal(ds.data))} style={{ ...btn(C.A), gridColumn: "1/-1", padding: "10px", fontSize: 14 }}>
        Calibrar todo automáticamente (del log actual)
      </button>
      {cfg("ACELERADOR", <>
        <CalField label="raw en 0 %" value={cal.gas.min} onChange={(v) => setCalPath("gas", "min", v)} />
        <CalField label="raw en 100 %" value={cal.gas.max} onChange={(v) => setCalPath("gas", "max", v)} />
      </>)}
      {cfg("FRENO", <>
        <CalField label="raw en 0 %" value={cal.brake.min} onChange={(v) => setCalPath("brake", "min", v)} />
        <CalField label="raw en 100 %" value={cal.brake.max} onChange={(v) => setCalPath("brake", "max", v)} />
      </>)}
      {cfg("DIRECCIÓN", <>
        <CalField label="raw izquierda" value={cal.steer.left} onChange={(v) => setCalPath("steer", "left", v)} />
        <CalField label="raw centro (0°)" value={cal.steer.center} onChange={(v) => setCalPath("steer", "center", v)} />
        <CalField label="raw derecha" value={cal.steer.right} onChange={(v) => setCalPath("steer", "right", v)} />
        <CalField label="ángulo máx (±°)" value={cal.steer.maxAngle} onChange={(v) => setCalPath("steer", "maxAngle", v)} />
      </>)}
      {cfg("IMU · MONTAJE", <>
        <label style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: C.dim, marginBottom: 6 }}>
          eje longitudinal
          <select value={cal.imu.long} onChange={(e) => setCalPath("imu", "long", e.target.value)} style={sel}>
            <option value="ax">Ax</option><option value="ay">Ay</option><option value="az">Az</option>
          </select>
        </label>
        <label style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: C.dim, marginBottom: 6 }}>
          eje lateral
          <select value={cal.imu.lat} onChange={(e) => setCalPath("imu", "lat", e.target.value)} style={sel}>
            <option value="ay">Ay</option><option value="ax">Ax</option><option value="az">Az</option>
          </select>
        </label>
        <label style={{ display: "block", fontSize: 12, color: C.dim, marginBottom: 4 }}>
          rotación fina: {cal.imu.rot}°
          <input type="range" min={-180} max={180} value={cal.imu.rot} onChange={(e) => setCalPath("imu", "rot", +e.target.value)} style={{ width: "100%" }} />
        </label>
        <div style={{ display: "flex", gap: 12, fontSize: 12, color: C.dim }}>
          <label><input type="checkbox" checked={cal.imu.invLong} onChange={(e) => setCalPath("imu", "invLong", e.target.checked)} /> invertir long.</label>
          <label><input type="checkbox" checked={cal.imu.invLat} onChange={(e) => setCalPath("imu", "invLat", e.target.checked)} /> invertir lat.</label>
        </div>
      </>)}
    </div>
  );

  const times = (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={{ fontFamily: "monospace", fontSize: 13, color: C.dim, letterSpacing: 1 }}>
        TIEMPOS Y SECTORES · {laps.length} vuelta{laps.length !== 1 ? "s" : ""}
        {splits.length === 0 && <span style={{ marginLeft: 10, color: C.dim }}>· define cortes en el mapa (pestaña Vueltas) para sectores propios</span>}
      </div>
      <AllSectorsTable data={ds.data} laps={laps} splits={splits} ideal={ideal} />
    </div>
  );

  return (
    <Shell page={page} setPage={setPage} onFile={onFile} fileName={fileName} hasData>
      {page === "overview" && overview}
      {page === "times" && times}
      {page === "analysis" && analysis}
      {page === "config" && config}
    </Shell>
  );
}

const sel = { background: C.bg, color: C.text, border: `1px solid ${C.line}`, borderRadius: 5, padding: "3px 6px", fontFamily: "monospace" };

/* marco / navegacion */
function Shell({ children, page, setPage, onFile, fileName, hasData }) {
  const tab = (id, label) => (
    <button onClick={() => setPage(id)} disabled={!hasData}
      style={{ background: "transparent", border: "none", cursor: hasData ? "pointer" : "default",
        color: page === id ? C.text : C.dim, fontWeight: page === id ? 700 : 500, fontSize: 14,
        padding: "6px 2px", borderBottom: page === id ? `2px solid ${C.A}` : "2px solid transparent" }}>{label}</button>
  );
  return (
    <div style={{ minHeight: "100vh", background: C.bg, color: C.text, fontFamily: "system-ui, sans-serif" }}>
      <header style={{ display: "flex", alignItems: "center", gap: 22, padding: "12px 18px", paddingTop: "calc(12px + env(safe-area-inset-top))", paddingLeft: "calc(18px + env(safe-area-inset-left))", paddingRight: "calc(18px + env(safe-area-inset-right))", borderBottom: `1px solid ${C.line}`, position: "sticky", top: 0, background: C.bg, zIndex: 5 }}>
        <div style={{ fontFamily: "monospace", fontWeight: 800, letterSpacing: 1, color: C.A }}>◢ PADDOCK</div>
        {hasData && <nav style={{ display: "flex", gap: 18 }}>{tab("overview", "Vueltas")}{tab("times", "Tiempos")}{tab("analysis", "Análisis")}{tab("config", "Calibración")}</nav>}
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 12 }}>
          {fileName && <span style={{ fontFamily: "monospace", fontSize: 12, color: C.dim }}>{fileName}</span>}
          {hasData && <label style={{ ...btn(null), padding: "6px 12px", cursor: "pointer" }}>Otro log
            <input type="file" accept=".csv" onChange={onFile} style={{ display: "none" }} /></label>}
        </div>
      </header>
      <main style={{ padding: 16, maxWidth: 1360, margin: "0 auto" }}>{children}</main>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
